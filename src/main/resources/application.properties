# ===========================================================================
# Anfang - Benutzer-Einstellungen – hier alle selbst konfigurierbaren Werte
# ===========================================================================

# --- Zugang und globale Drosselung der Tankerkönig-API ---
tankerkoenig.api.base-url=https://creativecommons.tankerkoenig.de/json
tankerkoenig.api.key=${TANKERKOENIG_API_KEY}
# Mindestabstand zwischen zwei API-Aufrufen: höchstens ein Aufruf/Minute (60 s + 2 s Puffer).
tankerkoenig.api.min-request-interval-ms=62000
# Sperrpause für alle Aufrufe nach einer Ratenlimit-Antwort (HTTP 503/429).
tankerkoenig.api.rate-limit-cooldown-ms=120000
tankerkoenig.api.connect-timeout-ms=10000
tankerkoenig.api.read-timeout-ms=15000

# --- Rotierende Preisabfrage ---
tankerkoenig.poll.initial-delay-ms=30000
# 5 Minuten zwischen zwei Preisabfragen: pro Intervall genau ein Ort, also ~1 API-Request/5min.
tankerkoenig.poll.interval-ms=300000
tankerkoenig.poll.max-locations=15
tankerkoenig.poll.max-stall-cycles=5

# --- Anreicherung der Tankstellen um Detaildaten ---
tankerkoenig.enrichment.initial-delay-ms=30000
# 1 Minuten zwischen zwei Anreicherungsabfragen; also ~1 API-Request/1min und 2s.
tankerkoenig.enrichment.interval-ms=62000
tankerkoenig.enrichment.batch-size=10

# --- Abzufragende Orte (bis zu 15). Pro Intervall wird ein Ort abgefragt, dann rotiert die Abfrage. ---
# Wenn mehrere Orte angegeben werden, dann muss auch "tankerkoenig.poll.interval-ms" entsprechend gesenkt werden
#
# Hinweis zur Genauigkeit: Zwei Nachkommastellen (rund 1 km) genügen völlig, da der Suchradius in
# Kilometern angegeben wird. Feiner aufgelöste Koordinaten verbessern das Ergebnis nicht, geben in
# einem öffentlichen Repository aber unnötig genau eine Adresse preis.
tankerkoenig.locations[0].name=Dresden
tankerkoenig.locations[0].latitude=51.04
tankerkoenig.locations[0].longitude=13.79
tankerkoenig.locations[0].radius-km=25
tankerkoenig.locations[0].type=all

# tankerkoenig.locations[1].name=Hamburg
# tankerkoenig.locations[1].latitude=53.54
# tankerkoenig.locations[1].longitude=9.98
# tankerkoenig.locations[1].radius-km=25
# tankerkoenig.locations[1].type=all

# --- Weboberfläche (nur aktiv im Profil "web") ---
# Adresse, unter der das Dashboard erreichbar ist (127.0.0.1 = nur lokal). Mit 0.0.0.0 im Netz öffnen.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}

# --- Echtzeit-Aktualisierung des Dashboards (Server-Sent Events; nur Profil "web") ---
# Takt, in dem der Server die Datenbank auf neue Preise prüft und verbundene Browser benachrichtigt
# bzw. die Verbindung per Heartbeat offen hält (ms). Niedriger = schnellere Anzeige, mehr DB-Prüfungen.
tankermax.web.live.pulse-interval-ms=5000
# Zeitlimit einer einzelnen Echtzeit-Verbindung (ms); 0 = kein Limit (der Heartbeat hält sie offen).
tankermax.web.live.emitter-timeout-ms=0

# --- KI-Preisvorhersage (Training nur Profil "ingest", Auslieferung nur Profil "web") ---
# Schaltet die gesamte Vorhersage an/aus. Bei "false" wird weder trainiert noch ein Vorhersage-
# Endpunkt bedient; das Dashboard blendet die Vorhersage-Schaltfläche dann aus.
tankermax.forecast.enabled=true
# Zeitpunkt des TÄGLICHEN Vorhersagelaufs als Cron-Ausdruck (Sekunde Minute Stunde Tag Monat Wochentag).
# Bei jedem Lauf entsteht die Vorhersagekurve neu, denn sie setzt auf dem aktuellen Preis als
# Ausgangswert auf. Trainiert wird dabei nur, wenn das Modell zu alt ist (siehe train-interval-days).
tankermax.forecast.cycle-cron=0 0 0 * * *
# Zeitzone, in der der Cron-Ausdruck ausgewertet wird.
tankermax.forecast.cycle-zone=Europe/Berlin
# Abstand zweier Neutrainings in Tagen. Das Modell wird also seltener, dafür gründlicher gebildet;
# die Kurve bleibt trotzdem täglich frisch. Bewusst nicht über den Cron gelöst: "*/3" im Tagesfeld
# feuert an den Monatstagen 1, 4, ... 28, 31 und ergäbe am Monatswechsel nur 1-2 Tage Abstand.
tankermax.forecast.train-interval-days=3
# Verzeichnis, in dem die trainierten Modelle je Kraftstoffart abgelegt werden (relativ zum
# Arbeitsverzeichnis des Dienstes). Fehlt eine Datei oder passt sie nicht mehr zum Merkmalsvektor,
# wird beim nächsten Lauf neu trainiert.
tankermax.forecast.model-store-path=data/forecast-models
# Holt die Vorhersage nach einem Neustart einmalig nach, falls für den heutigen Tag noch keine
# vorliegt (etwa nach einem Neustart tagsüber). Bei "false" wird erst zum nächsten Cron-Lauf gerechnet.
tankermax.forecast.catch-up-on-startup=true
# Vorhersagehorizont in Stunden ab dem aktuellen Zeitpunkt (laut Anforderung höchstens 3 Tage = 72 h).
tankermax.forecast.horizon-hours=72
# Zeitliche Auflösung der Vorhersagekurve in Minuten (60 = stündlich).
tankermax.forecast.resolution-minutes=60
# Länge des rollierenden Trainingsfensters in Tagen. Kürzer = weniger Arbeitsspeicher/CPU auf dem Pi.
tankermax.forecast.train-window-days=90
# Mindestanzahl an Tagen mit Historie, ab der eine Tankstelle eine Vorhersage erhält. Tankstellen
# mit weniger Historie werden übersprungen (im Dashboard erscheint dann kein Vorhersageverlauf).
tankermax.forecast.min-history-days=14
# Aufbewahrung der vollständigen Stundenkurve in Tagen (für Anzeige und kurzfristigen Abgleich).
# Muss größer als feedback-lookback-days sein, sonst fehlen der Selbstkorrektur genau die ältesten
# Stichproben ihres Messfensters.
tankermax.forecast.retention-curve-days=45
# Aufbewahrung der kompakten Tageszusammenfassung samt Treffer-Abgleich in Tagen (etwa ein Jahr).
tankermax.forecast.retention-summary-days=365
# Unsicherheitsband: schätzt zusätzlich ein unteres (q10) und oberes (q90) Quantil je Vorhersagepunkt.
# ABGESCHALTET: Jedes Quantil ist ein vollständiges zweites bzw. drittes Modell. Auf dem Raspberry Pi
# wurden ~1h45min je Modell gemessen (bei 1,5 Mio Zeilen und 600 Bäumen); mit Band wären das je
# Trainingsnacht vier Modelle pro Kraftstoffart und damit rund 21 Stunden. Das gesparte Budget geht
# statt dessen in die Punktvorhersage. Das Dashboard zeichnet das Band dann nicht (der Verlauf und der
# Tanktipp bleiben unverändert). Bei stärkerer Hardware wieder auf "true" setzen.
tankermax.forecast.quantiles-enabled=false
tankermax.forecast.quantile-low=0.10
tankermax.forecast.quantile-high=0.90
# Treffer-Abgleich: Abweichung (in Cent/Liter) bis zu der eine Vorhersage als "richtig" bzw. "fast
# richtig" gilt; darüber gilt sie als "falsch".
tankermax.forecast.accuracy-correct-max-ct=1.0
tankermax.forecast.accuracy-almost-max-ct=3.0
# Selbstkorrektur aus früheren Vorhersagen: Zeitfenster (Tage) und Deckel (Cent) der je Tankstelle und
# Horizont gemessenen systematischen Abweichung, die bei der nächsten Vorhersage gegengerechnet wird.
tankermax.forecast.feedback-lookback-days=30
tankermax.forecast.feedback-max-correction-ct=5.0
# Tanktipp: Tankvolumen (Liter) für die Ersparnisrechnung, Mindestersparnis (Cent) ab der zum Warten
# geraten wird, und das Zeitfenster (Minuten), innerhalb dessen ein günstigeres Tief erreichbar sein muss.
tankermax.forecast.tank-volume-liters=50
tankermax.forecast.recommendation-threshold-ct=1.5
tankermax.forecast.recommendation-max-wait-minutes=480
# Länge des Validierungsausschnitts in Tagen (jüngste Ausgangszeitpunkte). Beispiele, deren
# Zielzeitpunkt dorthin reicht, werden zusätzlich aus dem Training genommen (Sperrzone), damit der
# gemessene Fehler nicht beschönigt wird.
tankermax.forecast.validation-days=3
# Bildet nach der Fehlermessung das ausgelieferte Modell noch einmal über den GESAMTEN Zeitraum -
# also samt der jüngsten Tage, die für die Messung ausgespart bleiben müssen. Kostet einen zweiten
# Trainingsdurchgang, nutzt dafür alle Daten. Der ausgewiesene Fehler bleibt der aus der Messung.
tankermax.forecast.refit-on-full-data=true
# Startwert des Zufallsgenerators der Trainingsstichprobe; gleicher Wert = reproduzierbare Läufe.
tankermax.forecast.sampling-seed=20260726
# Obergrenze der Validierungszeilen; darüber wird ebenfalls zufällig ausgedünnt. Klein gegenüber der
# Trainingsmatrix und für den Speicherbedarf praktisch bedeutungslos.
tankermax.forecast.max-validation-rows=200000
# Obergrenze der Trainingszeilen je Kraftstoffart; darüber wird ZUFÄLLIG ausgedünnt. Grober Bedarf:
# Zeilen x 28 x 8 Byte für den Datensatz plus Zeilen x 27 x 4 Byte für die Sortierindizes von Smile,
# bei 1,2 Mio Zeilen also rund 270 MB + 130 MB. Passend zu einem Dienst mit -Xmx1g; bei knapperem
# Arbeitsspeicher entsprechend senken. Dazu die Zahl der Rechen-Threads (ein Kern bleibt fürs Polling).
tankermax.forecast.max-train-rows=1200000
tankermax.forecast.model-threads=3
# Schrittweiten der Trainingsstichprobe in Stunden. 1 bedeutet: jede Tagesstunde kommt als
# Ausgangszeitpunkt vor und jeder ausgelieferte Horizont wird auch trainiert. Größere Werte sparen
# Rechenzeit, lassen aber Tagesstunden und Horizonte komplett ungetraint - genau dort sagt das Modell
# anschließend blind vorher. Nur erhöhen, wenn das Training sonst zu lange dauert.
tankermax.forecast.train-origin-step-hours=1
tankermax.forecast.train-horizon-step-hours=1
# Hyperparameter des Gradient-Boosting-Modells. Auf die gemessene Rechenleistung des Raspberry Pi 5
# abgestimmt: rund 105 Minuten je Modell bei 1,5 Mio Zeilen und 600 Bäumen. Die Rechenzeit steigt
# praktisch linear mit Zeilen mal Bäumen; die Lernkapazität hängt dagegen am Produkt aus Bäumen und
# Lernrate (hier 350 x 0,05 = 17,5). Wer gbdt-trees ändert, sollte gbdt-shrinkage gegenläufig
# anpassen, sonst verschiebt sich nicht nur die Laufzeit, sondern auch die Güte.
# Erwartete Trainingsnacht mit diesen Werten: rund 5 Stunden für alle drei Kraftstoffarten.
tankermax.forecast.gbdt-trees=350
tankermax.forecast.gbdt-max-depth=8
tankermax.forecast.gbdt-max-nodes=64
tankermax.forecast.gbdt-node-size=40
tankermax.forecast.gbdt-shrinkage=0.05
tankermax.forecast.gbdt-subsample=0.7

# ===========================================================================
# Ende - Benutzer-Einstellungen – hier alle selbst konfigurierbaren Werte
# ===========================================================================

spring.application.name=TankerMax

spring.config.import=optional:file:.env[.properties]
spring.main.web-application-type=none

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Stapelweises Schreiben der Vorhersagezeilen (Kurve) je Lauf, um Datenbankverbindung und I/O auf dem
# Raspberry Pi zu schonen.
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Geplante Aufgaben: Preisabfrage + Anreicherung (Ingest), der Echtzeit-Puls (Web) sowie das tägliche
# Neutraining der Vorhersage (Ingest). Etwas Reserve, damit ein längerer Trainingslauf die übrigen
# Zyklen nicht verzögert.
spring.task.scheduling.pool.size=5
spring.lifecycle.timeout-per-shutdown-phase=30s

logging.level.de.lembergmax.tankermax=INFO
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
