spring.application.name=TankerMax

# Geheimnisse (DB-Zugang, API-Schlüssel) werden aus der optionalen .env-Datei geladen.
spring.config.import=optional:file:.env[.properties]

# Reiner Hintergrunddienst ohne Web-Oberfläche; der Aufgabenplaner hält die Anwendung am Leben.
spring.main.web-application-type=none

# ===========================================================================
# System / Infrastruktur (normalerweise nicht zu ändern)
# ===========================================================================

# --- Datenbank (Zugangsdaten aus .env) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Verbindungs-Pool gegen abgebrochene Leerlauf-Verbindungen der entfernten MariaDB absichern.
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000

# Hibernate legt das Schema anhand der Entitäten an und ergänzt fehlende Tabellen/Spalten.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Zeitstempel (Instant) konsequent in UTC schreiben.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Eigener Thread-Pool für die geplanten Abfragen (Preisabfrage + Anreicherung).
spring.task.scheduling.pool.size=3

# Sauberes Herunterfahren: geplante DB-Schreibvorgänge abschließen, bevor die JVM endet.
spring.lifecycle.timeout-per-shutdown-phase=30s

logging.level.de.lembergmax.tankermax=INFO
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14

# ===========================================================================
# Benutzer-Einstellungen – hier alle selbst konfigurierbaren Werte
# ===========================================================================

# --- Zugang und globale Drosselung der Tankerkönig-API ---
tankerkoenig.api.base-url=https://creativecommons.tankerkoenig.de/json
tankerkoenig.api.key=${TANKERKOENIG_API_KEY}
# Mindestabstand zwischen zwei API-Aufrufen: höchstens ein Aufruf/Minute (60 s + 2 s Puffer).
tankerkoenig.api.min-request-interval-ms=62000
# Sperrpause für alle Aufrufe nach einer Ratenlimit-Antwort (HTTP 503/429).
tankerkoenig.api.rate-limit-cooldown-ms=120000
tankerkoenig.api.connect-timeout-ms=10000
tankerkoenig.api.read-timeout-ms=15000

# --- Rotierende Preisabfrage ---
tankerkoenig.poll.initial-delay-ms=10000
# 5 Minuten zwischen zwei Preisabfragen: pro Intervall genau ein Ort, also ~1 API-Request/5min.
tankerkoenig.poll.interval-ms=300000
tankerkoenig.poll.max-locations=15
tankerkoenig.poll.max-stall-cycles=5

# --- Anreicherung der Tankstellen um Detaildaten ---
tankerkoenig.enrichment.initial-delay-ms=30000
tankerkoenig.enrichment.interval-ms=300000
tankerkoenig.enrichment.batch-size=10

# --- Abzufragende Orte (bis zu 15). Pro Intervall wird ein Ort abgefragt, dann rotiert die Abfrage. ---
tankerkoenig.locations[0].name=Dresden
tankerkoenig.locations[0].latitude=51.04
tankerkoenig.locations[0].longitude=13.79
tankerkoenig.locations[0].radius-km=25
tankerkoenig.locations[0].type=all

