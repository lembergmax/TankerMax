# Zusatzkonfiguration des Profils "web".
#
# Aktiviert den eingebetteten Web-Server für das Dashboard und die REST-API. Ohne dieses
# Profil bleibt die Anwendung kopflos (spring.main.web-application-type=none aus application.properties),
# sodass ein reiner "ingest"-Lauf keinen Web-Server startet.
spring.main.web-application-type=servlet

# HTTP-Antwortkompression (Gzip): verkleinert vor allem die JSON-Antworten der /api-Endpunkte ab
# etwa 1 KB deutlich. Der Browser entpackt transparent; an den Antworten ändert sich inhaltlich nichts.
server.compression.enabled=true
server.compression.mime-types=application/json,text/css,application/javascript
server.compression.min-response-size=1024

# Actuator: maschinenlesbarer Gesundheitsstatus (/actuator/health) und Kennzahlen (/actuator/metrics).
# Nur im Profil "web" über HTTP erreichbar, da hier der Web-Server läuft. Im kombinierten Lauf
# "web,ingest" enthält die Gesundheit zugleich den Ingest-Indikator (Stillstandserkennung).
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
